# Checks that run on every push to main and on every pull request. Read-only: no secrets, no deploys, no Supabase.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so the production build can run; no real project is contacted.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-site-key
      TURNSTILE_SECRET_KEY: ci-placeholder-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The tool is run directly (not the wrapper action, which cannot scan the first push of a new branch): the whole history, default rules.
      - name: Scan the whole history
        run: |
          VER=8.21.2
          FILE=gitleaks_${VER}_linux_x64.tar.gz
          # The expected checksum is pinned here, so a changed release file is refused.
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${FILE}"
          echo "${SHA256}  ${FILE}" | sha256sum -c -
          tar -xzf "${FILE}" gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
